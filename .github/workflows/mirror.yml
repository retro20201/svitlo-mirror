name: Mirror outage schedules

on:
  schedule:
    # The fallback. The mirror runs on a Kyiv server every 5 minutes (tools/mirror/vps/): several
    # operators refuse addresses outside Ukraine, and this cron drops most of its runs. Every run
    # here first asks whether that server finished a cycle in the last 20 minutes, and stands down
    # if it did — two writers deploying the whole site overwrite each other's copies.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy even when no schedule changed (for testing or a manual re-publish)'
        type: boolean
        default: false
      test_push:
        description: 'Send a test push to this topic suffix (e.g. kyiv). Empty = none.'
        type: string
        default: ''
      test_push_visible:
        description: 'Make the test push show a banner — the only way to confirm delivery to a device.'
        type: boolean
        default: false

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every test file, not just one: the suite is offline and takes under a second, and the
      # parsers it covers are the part of this repo that fails silently rather than loudly.
      # Listed with `find` rather than a directory argument, which makes the runner execute
      # mirror.mjs itself and report the mirror run as a failed test.
      - name: Test the parsers and the push decision
        run: node --test $(find tools -name '*.test.mjs')

      # Lives in RUNNER_TEMP for the length of the job and is deleted whatever happens.
      - name: Write service account
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOLY_SVITLO }}

      # Prints why it decided. Any doubt (no beat, an unreadable one) means publishing from here.
      - name: Is the Kyiv server publishing?
        id: kyiv
        run: node tools/mirror/heartbeat.mjs check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json

      # The committed region files are a 2026-09-07 seed, not what phones have. Starting from what
      # is served makes "keep the last good copy" and the change/push decision compare against the
      # live mirror; from the seed, Kyiv looked changed on every run and woke every phone for nothing.
      # Every region the registry knows, not only the committed seeds: a region added after the
      # seed had no file to restore, so every run treated it as new and pushed to its phones.
      # Only a 404 means "not published yet". A 5xx, a reset or a body cut off after its 200 leaves
      # the baseline unknown, and this run then publishes nothing (the same rule as tools/mirror/vps).
      - name: Restore the served mirror
        id: restore
        if: steps.kyiv.outputs.fresh != 'true' || inputs.force_deploy
        run: |
          regions=$(node --input-type=module -e "import { REGIONS } from './tools/mirror/regions.mjs'; console.log(REGIONS.filter((r) => r.source).map((r) => r.id).join(' '))")
          baseline=ok
          for name in index $regions; do
            file="firebase/public/v1/$name.json"
            code=$(curl -sS --retry 2 --max-time 30 -o "$file.served" -w '%{http_code}' "https://koly-svitlo.web.app/v1/$name.json") && rc=0 || rc=$?
            if [ "$rc" = "0" ] && [ "$code" = "200" ] \
              && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file.served"; then
              mv "$file.served" "$file"
            elif [ "$rc" = "0" ] && [ "$code" = "404" ]; then
              rm -f "$file.served"
            else
              rm -f "$file.served"
              echo "::warning::$name: HTTP ${code:-none}, curl $rc — not publishing from an unknown baseline"
              baseline=unknown
              break
            fi
          done
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      # Skipped while the Kyiv server publishes, which also leaves the deploy and the push below
      # with nothing to do.
      - name: Fetch and validate
        id: mirror
        if: steps.restore.outputs.baseline == 'ok'
        run: node tools/mirror/mirror.mjs

      # Reports when a seasonal region starts publishing again, so its adapter gets written
      # against real markup instead of guesswork. Never blocks the mirror.
      - name: Probe seasonal regions
        continue-on-error: true
        run: |
          node tools/mirror/probe.mjs --selftest
          node tools/mirror/probe.mjs

      # Asked again right before publishing: the Kyiv server may have come back while this run spent
      # minutes timing out on operators that refuse US addresses, and its copy is the newer one.
      - name: Is the Kyiv server still away?
        id: kyiv_again
        if: steps.mirror.outputs.changed == 'true' && !inputs.force_deploy
        run: node tools/mirror/heartbeat.mjs check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json

      - name: Deploy to Firebase Hosting
        if: steps.restore.outputs.baseline == 'ok' && ((steps.mirror.outputs.changed == 'true' && steps.kyiv_again.outputs.fresh != 'true') || inputs.force_deploy)
        run: npx --yes firebase-tools@latest deploy --only hosting --project koly-svitlo --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json

      # Strictly after the deploy: a phone woken before the new file is served would refetch
      # the old schedule and believe it current until the next background refresh.
      - name: Announce changed regions
        if: steps.mirror.outputs.notify != '' && steps.kyiv_again.outputs.fresh != 'true'
        continue-on-error: true
        run: node tools/mirror/send-push.mjs "${{ steps.mirror.outputs.notify }}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json

      # Proves the credentials and the FCM role work without waiting for a real schedule change.
      # "general" is a topic nothing subscribes to, so a test cannot wake anyone by accident.
      - name: Test push
        if: inputs.test_push != ''
        run: |
          if [ "${{ inputs.test_push_visible }}" = "true" ]; then
            node tools/mirror/send-push.mjs --visible "Коли Світло|Перевірка доставки" "${{ inputs.test_push }}"
          else
            node tools/mirror/send-push.mjs "${{ inputs.test_push }}"
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json

      - name: Remove service account
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
