<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Графік відключень — Коли Світло</title>
<link rel="stylesheet" href="/style.css">
<style>
  :root { --on: #ffd54d; --off: #2b2f38; --maybe-a: #ffd54d; --maybe-b: #9aa0ab; --warn-bg: #fff4e0; --warn-line: #f0c36d; --now: #e5484d; }
  @media (prefers-color-scheme: dark) {
    :root { --on: #f2c53d; --off: #07080a; --maybe-b: #4a4f5a; --warn-bg: #2b2313; --warn-line: #6b5420; }
  }
  .status { font-size: 21px; font-weight: 700; line-height: 1.3; margin: 0; }
  .status .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; background: var(--muted); }
  .status .dot.on { background: var(--on); } .status .dot.off { background: var(--off); border: 1px solid var(--line); }
  .status .dot.maybe { background: var(--maybe-b); }
  .warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .warn p { margin: 0; } .warn p + p { margin-top: 6px; color: var(--muted); font-size: 15px; }
  .day h2 { margin-top: 0; }
  .bar { position: relative; display: flex; height: 30px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .bar i { flex: 1 1 0; display: block; }
  .bar i:nth-child(2n+3) { box-shadow: inset 1px 0 0 rgba(128, 128, 128, 0.35); }
  .bar .on { background: var(--on); } .bar .off { background: var(--off); }
  .bar .maybe { background: repeating-linear-gradient(135deg, var(--maybe-a) 0 4px, var(--maybe-b) 4px 8px); }
  .bar .unknown { background: var(--line); }
  .bar b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--now); }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  .legend { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin: 0 5px 0 12px; border: 1px solid var(--line); }
  .legend i:first-child { margin-left: 0; }
  .legend .on { background: var(--on); } .legend .off { background: var(--off); }
  .day p { margin: 6px 0 0; }
  .day strong { white-space: nowrap; }
  .muted { color: var(--muted); }
  .picker label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .picker select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
                   background: var(--surface); color: var(--text); }
  .button.quiet { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .buttons a { margin: 0 8px 8px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><a class="logo" href="/">← Коли Світло</a></header>
  <h1 id="title">Графік відключень</h1>
  <p id="place" class="lead"></p>

  <div id="picker" class="card picker" hidden>
    <label for="pick-region" id="pick-region-label"></label>
    <select id="pick-region"></select>
    <label for="pick-queue" id="pick-queue-label"></label>
    <select id="pick-queue" disabled></select>
    <p id="pick-note" class="muted"></p>
  </div>

  <div id="status" class="card" hidden><p class="status"><span class="dot" id="dot"></span><span id="status-text"></span></p></div>
  <div id="warning" class="card warn" hidden></div>
  <div id="days"></div>
  <p id="meta" class="updated"></p>
  <p id="links" class="updated"></p>

  <div class="card" id="app">
    <p id="what"></p>
    <p class="buttons"><a class="button" id="open" href="#" hidden></a><a class="button quiet" id="store" href="https://apps.apple.com/ua/app/id6806010572" hidden></a></p>
    <p id="hint" class="muted" hidden></p>
  </div>

  <noscript><p>Щоб побачити графік, увімкніть JavaScript — або відкрийте застосунок «Коли Світло».</p></noscript>

  <footer>
    <a href="/">Головна</a> · <a href="/privacy">Політика конфіденційності</a> · <a href="/support">Підтримка</a>
  </footer>
</main>
<script src="/add/texts.js"></script>
<script src="/add/schedule.js"></script>
<script>
// The link in «Поділитися» opens this page. The app takes the queue (`svitlo://add`); anyone without the app — an
// Android phone, a computer — sees the queue's schedule for today and tomorrow, from the same files the app reads.
// Only a region and a queue are in the address: never a street, a name or anything about the person who sent it.
(function () {
  'use strict';
  var S = window.KolySvitloSchedule;
  var code = (navigator.language || 'uk').slice(0, 2);
  var t = window.KolySvitloTexts[code] || window.KolySvitloTexts.uk;
  var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent || '');
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  };
  var fill = function (template, key, value) { return template.replace('{' + key + '}', value); };
  var json = function (path) {
    return fetch(path).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  };

  document.documentElement.lang = t.lang;
  document.title = t.pageTitle;
  $('store').textContent = t.store;
  $('open').textContent = t.open;

  var params = new URLSearchParams(location.search);
  var region = params.get('region') || '';
  var queue = params.get('queue') || '';
  var valid = /^[A-Za-z0-9._-]{1,40}$/;

  function word(name) {
    return name.replace(/^Черга /, t.queue + ' ').replace(/^Група /, t.group + ' ');
  }

  function pitch(regionTitle, queueTitle) {
    $('what').textContent = apple ? t.pitchApple : t.pitchOther;
    $('store').hidden = !apple;
    if (!apple || !queueTitle) return;
    $('open').hidden = false;
    $('open').href = 'svitlo://add?region=' + encodeURIComponent(region) + '&queue=' + encodeURIComponent(queue);
    $('hint').hidden = false;
    $('hint').textContent = t.hint + (regionTitle ? regionTitle + ' → ' : '') + queueTitle;
  }

  // ---- no queue in the address: choose one -------------------------------------------------------------------

  function picker(index) {
    $('title').textContent = t.pickTitle;
    $('place').textContent = t.pickLead;
    $('picker').hidden = false;
    $('pick-region-label').textContent = t.pickRegion;
    $('pick-queue-label').textContent = t.pickQueue;
    var regions = $('pick-region');
    var queues = $('pick-queue');
    var option = function (value, text) { var o = el('option', '', text); o.value = value; return o; };
    regions.appendChild(option('', t.pickFirst));
    (index.regions || []).forEach(function (r) {
      if (r.status === 'live' || r.hasSchedule) regions.appendChild(option(r.id, r.title));
    });
    regions.onchange = function () {
      queues.innerHTML = '';
      queues.disabled = true;
      $('pick-note').textContent = '';
      if (!regions.value) return;
      json('/v1/' + encodeURIComponent(regions.value) + '.json').then(function (data) {
        var list = S.queues(data);
        if (!list.length) { $('pick-note').textContent = t.pickNoQueues; return; }
        queues.appendChild(option('', t.pickFirst));
        list.forEach(function (q) { queues.appendChild(option(q.id, word(q.name))); });
        queues.disabled = false;
      }, function () { $('pick-note').textContent = t.failed; });
    };
    queues.onchange = function () {
      if (regions.value && queues.value) {
        location.search = '?region=' + encodeURIComponent(regions.value) + '&queue=' + encodeURIComponent(queues.value);
      }
    };
    pitch('', '');
  }

  // ---- a queue's schedule -----------------------------------------------------------------------------------

  function hours(minutes) {
    var value = String(Math.round(minutes / 6) / 10);
    return (t.lang === 'en' ? value : value.replace('.', ',')) + ' ' + t.hours;
  }

  function span(interval) { return S.clock(interval.from) + '–' + S.clock(interval.to); }

  function dateWords(dateKey) {
    var p = dateKey.split('-');
    var noon = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12));
    try { return noon.toLocaleDateString(t.lang, { day: 'numeric', month: 'long', timeZone: 'UTC' }); }
    catch (e) { return p[2] + '.' + p[1]; }
  }

  function listLine(label, list, tail) {
    var p = el('p');
    p.appendChild(document.createTextNode(label + ': '));
    list.forEach(function (interval, i) {
      if (i) p.appendChild(document.createTextNode(', '));
      p.appendChild(el('strong', '', span(interval)));
    });
    if (tail) p.appendChild(document.createTextNode(' · ' + tail));
    return p;
  }

  function dayCard(day, heading, missing, nowSlot, nowMinute) {
    var card = el('div', 'card day');
    card.appendChild(el('h2', '', heading + ', ' + dateWords(day.date)));
    if (!day.published) { card.appendChild(el('p', 'muted', missing)); return card; }
    var bar = el('div', 'bar');
    bar.setAttribute('aria-hidden', 'true');
    day.slots.forEach(function (state) { bar.appendChild(el('i', state)); });
    if (nowSlot !== null) {
      var mark = el('b');
      mark.style.left = (nowMinute / 14.4).toFixed(2) + '%';
      bar.appendChild(mark);
    }
    card.appendChild(bar);
    var ticks = el('div', 'ticks');
    ticks.setAttribute('aria-hidden', 'true');
    ['0', '6', '12', '18', '24'].forEach(function (hour) { ticks.appendChild(el('span', '', hour)); });
    card.appendChild(ticks);
    if (day.off.length) card.appendChild(listLine(t.off, day.off, fill(t.total, 'hours', hours(day.offMinutes))));
    if (day.maybe.length) card.appendChild(listLine(t.maybe, day.maybe, ''));
    if (!day.off.length && !day.maybe.length && !day.unknown) card.appendChild(el('p', '', t.none));
    if (day.unknown) card.appendChild(el('p', 'muted', t.someUnknown));
    return card;
  }

  function render(found, data, queueTitle) {
    var view = S.view(data, queue, Date.now());
    var status = $('status');
    var warning = $('warning');
    var days = $('days');
    warning.innerHTML = '';
    warning.hidden = true;
    days.innerHTML = '';
    var warn = function (line, note) {
      warning.hidden = false;
      warning.appendChild(el('p', '', line));
      if (note) warning.appendChild(el('p', '', note));
    };

    // The queue is not in a table that has other queues: the link is wrong, and «не оприлюднено» would not be true.
    var all = S.queues(data);
    if (all.length && !all.some(function (q) { return q.id === queue; })) {
      status.hidden = true;
      $('meta').textContent = '';
      warn(t.noQueue);
      return;
    }

    // A queue with an operator of its own inside the region (ЦЕК under «Дніпро») is not the region operator's.
    var foreign = ((data.fact && data.fact.queueEmergency && data.fact.queueEmergency.queues) || []).indexOf(queue) >= 0;
    $('place').textContent = found.title + (found.operator && !foreign ? ' · ' + found.operator : '');

    var known = view.today.published;
    status.hidden = false;
    // A region whose operator we cannot reach is not a region with nothing published.
    var text = known ? '' : (found.stale ? t.noData : found.status === 'seasonal' ? t.seasonal : t.noToday);
    var dot = '';
    if (known && view.status) {
      dot = view.status.state;
      text = { on: t.nowOn, off: t.nowOff, maybe: t.nowMaybe, unknown: t.nowUnknown }[view.status.state];
      if (view.status.until !== null && view.status.state !== 'unknown') {
        text += ' — ' + (view.status.until > 48
          ? fill(t.untilTomorrow, 'time', S.clock(view.status.until - 48))
          : fill(t.until, 'time', S.clock(view.status.until)));
      }
      text += '.';
    }
    $('dot').className = 'dot ' + dot;
    $('status-text').textContent = text;

    if (view.today.emergency.on) warn(t.emergency, view.today.emergency.note);
    if (known && found.stale) warn(t.stale);

    if (known) {
      var legend = el('p', 'legend');
      legend.setAttribute('aria-hidden', 'true');
      legend.appendChild(el('i', 'on')); legend.appendChild(document.createTextNode(t.legendOn));
      legend.appendChild(el('i', 'off')); legend.appendChild(document.createTextNode(t.legendOff));
      days.appendChild(legend);
    }
    if (known || (found.status !== 'seasonal' && !found.stale)) {
      days.appendChild(dayCard(view.today, t.today, t.noToday, view.nowSlot, view.now.hour * 60 + view.now.minute));
      days.appendChild(dayCard(view.tomorrow, t.tomorrow, t.noTomorrow, null, 0));
    }

    var meta = [];
    if (view.update) meta.push(fill(t.updated, 'stamp', view.update));
    if (data.mirroredAt && !isNaN(Date.parse(data.mirroredAt))) {
      var checked = S.kyivParts(Date.parse(data.mirroredAt));
      meta.push(fill(t.checked, 'time', (checked.hour < 10 ? '0' : '') + checked.hour + ':' + (checked.minute < 10 ? '0' : '') + checked.minute));
    }
    meta.push(t.kyivTime);
    $('meta').textContent = meta.join(' ');
  }

  function links(found) {
    var box = $('links');
    box.innerHTML = '';
    if (found && /^https:\/\//.test(found.operatorSite || '')) {
      var site = el('a', '', t.site);
      site.href = found.operatorSite;
      site.rel = 'noopener nofollow';
      box.appendChild(site);
      box.appendChild(document.createTextNode(' · '));
    }
    var other = el('a', '', t.other);
    other.href = '/add';
    box.appendChild(other);
  }

  function schedule(index) {
    var found = (index.regions || []).filter(function (r) { return r.id === region; })[0];
    if (!found) { $('place').textContent = t.unknownRegion; links(null); pitch('', ''); return; }
    var fallback = word(queue.replace(/^GPV/, 'Черга '));
    $('title').textContent = fallback;
    $('place').textContent = found.title + (found.operator ? ' · ' + found.operator : '');
    links(found);

    var last = null;
    var load = function () {
      return json('/v1/' + encodeURIComponent(region) + '.json').then(function (data) {
        last = data;
        var names = (data.preset && data.preset.sch_names) || {};
        var queueTitle = word(names[queue] || queue.replace(/^GPV/, 'Черга '));
        $('title').textContent = queueTitle;
        document.title = queueTitle + ' · ' + found.title + ' — ' + t.pageTitle;
        pitch(found.title, queueTitle);
        render(found, data, queueTitle);
      }, function () {
        if (last) return;   // the schedule already on the page is better than an error over it
        $('status').hidden = false;
        $('status-text').textContent = found.status === 'seasonal' ? t.seasonal : t.failed;
        pitch(found.title, fallback);
      });
    };
    load();
    // The files change every few minutes; the red mark moves with the clock.
    setInterval(function () { if (!document.hidden) load(); }, 5 * 60 * 1000);
    setInterval(function () { if (!document.hidden && last) render(found, last, ''); }, 30 * 1000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  }

  json('/v1/index.json').then(function (index) {
    if (valid.test(region) && valid.test(queue)) schedule(index); else picker(index);
  }, function () {
    $('status').hidden = false;
    $('status-text').textContent = t.failed;
    pitch('', '');
  });
}());
</script>
</body>
</html>
